[package]
name = "server"
version = "0.1.0"
description = "The personal server: JSON API, SQLite storage, and the built web app."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
constant_time_eq = "0.6.1"
cookie = "0.18"
domain.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
uuid = { version = "1.28.0", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints]
workspace = true
